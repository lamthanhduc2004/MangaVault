# H2 in MySQL compatibility mode: the suite must run without a MySQL server
# (CI, a fresh clone, or a machine where Docker is unavailable).
spring.datasource.url=jdbc:h2:mem:mangavault;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Deterministic fixtures — no demo content, no random secrets.
app.demo.seed=false
app.jwt.secret=test-secret-key-for-unit-tests-0123456789abcdef
app.jwt.expiration-seconds=3600
app.admin.username=testadmin
app.admin.password=testadmin123
app.admin.email=testadmin@mangavault.local
app.cors.allowed-origins=http://localhost:5173
