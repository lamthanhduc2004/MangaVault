spring.application.name=manga-vault

# PaaS platforms (Render, Railway, Cloud Run...) inject the port to bind through PORT.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/manga_vault}
spring.datasource.username=${DB_USERNAME:manga_user}
spring.datasource.password=${DB_PASSWORD}

# Keep `update` for local development; production should run with `validate` or `none`
# once the schema is stable. Every new column on an existing table must declare a
# DEFAULT (see entity columnDefinition) because `update` never backfills rows.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

# Batches lazy associations into a single IN query instead of one per parent row.
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# Comma-separated frontend origins allowed by CORS (Vite dev server by default)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT signing (HS256). The default secret is for local development only —
# set JWT_SECRET (>= 32 bytes) in any shared or production environment.
app.jwt.secret=${JWT_SECRET:manga-vault-dev-secret-key-change-me-0123456789}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# Bootstrap admin account (created at startup when no ADMIN user exists)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.email=${ADMIN_EMAIL:admin@mangavault.local}

# Seed demo stories/chapters on first startup when the database is empty.
app.demo.seed=${DEMO_SEED:true}
