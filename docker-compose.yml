services:
  mysql:
    image: mysql:8.4
    container_name: mangavault-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: manga_vault
      MYSQL_USER: manga_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-manga_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    ports:
      - "3306:3306"
    volumes:
      - mangavault-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root_pass}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mangavault-mysql-data:
